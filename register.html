<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NovaPay | Register</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

<h1 class="logo">Nova<span>Pay</span></h1>

<p class="subtitle">
Create your account
</p>

<div class="card">

<h2 class="title">
Register
</h2>

<p class="desc">
Register now and receive <b>$1 Bonus</b>
</p>

<div class="input-group">

<label>Full Name</label>

<input
id="fullname"
class="input"
type="text"
placeholder="Enter your full name">

</div>

<div class="input-group">

<label>Email</label>

<input
id="email"
class="input"
type="email"
placeholder="Enter your email">

</div>

<div class="input-group">

<label>Password</label>

<input
id="password"
class="input"
type="password"
placeholder="Enter password">

</div>

<div class="input-group">

<label>Confirm Password</label>

<input
id="confirmPassword"
class="input"
type="password"
placeholder="Confirm password">

</div>

<div class="input-group">

<label>Referral Code (Optional)</label>

<input
id="referral"
class="input"
type="text"
placeholder="Referral code">

</div>

<button
class="btn"
onclick="register()">

Register

</button>

<div class="small">

Already have an account?

<a href="login.html">

Login

</a>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="script.js"></script>

</body>
</html>
